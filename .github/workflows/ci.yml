name: Collector Regression Tests

on:
  pull_request:
    branches: [main]
    paths: ["scripts/**", "tests/**", "assets/**", "index.html", "requirements.txt", "package.json", "package-lock.json", ".github/workflows/**"]
  push:
    branches: [main, fix/collector-reliability-audit]
    paths: ["scripts/**", "tests/**", "assets/**", "index.html", "requirements.txt", "package.json", "package-lock.json", ".github/workflows/**"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: collector-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install collector dependency
        run: python -m pip install -r requirements.txt
      - name: Compile all scripts and run every regression test
        run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -v
      - name: Check browser JavaScript syntax
        run: |
          node --check assets/script.js
          node --check assets/apps-data.js
      - name: Install browser test tools
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Test desktop and mobile interactions
        run: npm run test:browser
