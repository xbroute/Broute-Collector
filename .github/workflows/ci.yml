name: Collector Regression Tests

on:
  pull_request:
    branches: [main]
    paths: ["scripts/**", "tests/**", "assets/**", "index.html", "requirements*.txt", "Dockerfile", "compose.yml", "deploy/**", "package.json", "package-lock.json", ".github/workflows/**"]
  push:
    branches: [main, fix/collector-reliability-audit]
    paths: ["scripts/**", "tests/**", "assets/**", "index.html", "requirements*.txt", "Dockerfile", "compose.yml", "deploy/**", "package.json", "package-lock.json", ".github/workflows/**"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: collector-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: broute_test
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: broute_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U broute_test -d broute_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      TEST_DATABASE_URL: postgresql://broute_test:isolated_ci_only@127.0.0.1:5432/broute_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install collector dependency
        run: python -m pip install -r requirements-server.txt
      - name: Compile all scripts and run every regression test
        run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -v
      - name: Check browser JavaScript syntax
        run: |
          node --check assets/script.js
          node --check assets/apps-data.js
      - name: Install browser test tools
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Test desktop and mobile interactions
        run: npm run test:browser
