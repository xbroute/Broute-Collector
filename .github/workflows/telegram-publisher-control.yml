name: Telegram Publisher Control

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Telegram publisher state"
        required: true
        type: choice
        default: "ON"
        options:
          - "ON"
          - "OFF"

permissions:
  contents: write
  actions: write

concurrency:
  group: "telegram-publisher-control"
  cancel-in-progress: false

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Persist requested state
        id: persist
        env:
          REQUESTED_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [ "${REQUESTED_MODE}" = "ON" ]; then
            target=true
          else
            target=false
          fi

          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main

            TARGET_ENABLED="${target}" python - <<'PY'
          import json
          import os
          import tempfile

          path = ".github/telegram-publisher-control.json"
          enabled = os.environ["TARGET_ENABLED"].lower() == "true"
          os.makedirs(os.path.dirname(path), exist_ok=True)

          payload = {"enabled": enabled}
          fd, tmp = tempfile.mkstemp(prefix="telegram-control-", suffix=".json", dir=os.path.dirname(path))
          try:
              with os.fdopen(fd, "w", encoding="utf-8") as f:
                  json.dump(payload, f, ensure_ascii=False, indent=2)
                  f.write("\n")
                  f.flush()
                  os.fsync(f.fileno())
              os.replace(tmp, path)
          finally:
              if os.path.exists(tmp):
                  os.unlink(tmp)
          PY

            if git diff --quiet -- .github/telegram-publisher-control.json; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "Telegram publisher is already ${REQUESTED_MODE}."
              exit 0
            fi

            git add .github/telegram-publisher-control.json
            git commit -m "chore: turn Telegram publisher ${REQUESTED_MODE}"

            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              echo "Telegram publisher state persisted as ${REQUESTED_MODE}."
              exit 0
            fi

            echo "Control push attempt ${attempt} raced with main; retrying from latest main..."
            sleep $((attempt * 2))
          done

          echo "Could not persist Telegram publisher state after 5 attempts." >&2
          exit 1

      - name: Ensure one publisher run exists when ON
        if: inputs.mode == 'ON'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          response=$(curl --fail-with-body --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/publish-telegram.yml/runs?per_page=30")

          active=$(printf '%s' "${response}" | python -c '
          import json, sys
          data = json.load(sys.stdin)
          active_statuses = {"queued", "in_progress", "pending", "requested", "waiting"}
          print(sum(1 for run in data.get("workflow_runs", []) if run.get("status") in active_statuses))
          ')

          if [ "${active}" -gt 0 ]; then
            echo "Publisher is ON and already has ${active} active/waiting run(s). No duplicate dispatch."
            exit 0
          fi

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --header "Content-Type: application/json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/publish-telegram.yml/dispatches" \
            --data '{"ref":"main"}'

          echo "Publisher is ON; one publisher run was dispatched."

      - name: Confirm OFF behavior
        if: inputs.mode == 'OFF'
        run: |
          echo "Publisher is OFF. Any controlled publisher currently running will stop gracefully on its next control check; queue and sent-state are preserved."
