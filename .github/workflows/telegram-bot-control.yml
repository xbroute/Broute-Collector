name: Telegram Bot Control

on:
  schedule:
    - cron: "1-56/5 * * * *"
  workflow_run:
    workflows:
      - "Update Subscription"
      - "Publish Telegram Configs"
    types: [completed]
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - "scripts/telegram_bot_control.py"
      - "scripts/telegram_bot_control_verified.py"
      - "scripts/telegram_bot_control_full.py"
      - "scripts/telegram_bot_destination_extension.py"
      - "scripts/telegram_destinations.py"
      - "scripts/telegram_bot_source_extension.py"
      - "scripts/telegram_bot_promo_extension.py"
      - "scripts/telegram_managed_sources.py"
      - "scripts/telegram_promo_config.py"
      - "scripts/telegram_publisher.py"
      - "scripts/telegram_publisher_control.py"
      - "scripts/telegram_publisher_controlled.py"
      - "scripts/telegram_multidestination_publisher.py"
      - "scripts/telegram_copy_format.py"
      - "tests/test_telegram_destinations.py"
      - "tests/test_telegram_multidestination.py"
      - "tests/test_telegram_bot_control.py"
      - "tests/test_telegram_bot_control_verified.py"
      - "tests/test_telegram_bot_sources.py"
      - "tests/test_telegram_promo.py"
      - "tests/test_telegram_publisher.py"
      - ".github/telegram-bot-bootstrap.json"
      - ".github/workflows/telegram-bot-control.yml"
  pull_request:
    branches:
      - main
    paths:
      - "scripts/telegram_bot_control.py"
      - "scripts/telegram_bot_control_verified.py"
      - "scripts/telegram_bot_control_full.py"
      - "scripts/telegram_bot_destination_extension.py"
      - "scripts/telegram_destinations.py"
      - "scripts/telegram_bot_source_extension.py"
      - "scripts/telegram_bot_promo_extension.py"
      - "scripts/telegram_managed_sources.py"
      - "scripts/telegram_promo_config.py"
      - "scripts/telegram_publisher.py"
      - "scripts/telegram_publisher_controlled.py"
      - "scripts/telegram_multidestination_publisher.py"
      - "tests/test_telegram_destinations.py"
      - "tests/test_telegram_multidestination.py"
      - ".github/workflows/telegram-bot-control.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: "telegram-bot-control"
  cancel-in-progress: false

jobs:
  poll:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout latest code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile Telegram and collector scripts
        if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          python -m py_compile \
            scripts/telegram_bot_control.py \
            scripts/telegram_bot_control_verified.py \
            scripts/telegram_bot_control_full.py \
            scripts/telegram_bot_destination_extension.py \
            scripts/telegram_destinations.py \
            scripts/telegram_bot_source_extension.py \
            scripts/telegram_bot_promo_extension.py \
            scripts/telegram_managed_sources.py \
            scripts/telegram_promo_config.py \
            scripts/telegram_publisher.py \
            scripts/telegram_publisher_control.py \
            scripts/telegram_publisher_controlled.py \
            scripts/telegram_multidestination_publisher.py \
            scripts/telegram_cycle_state.py \
            scripts/telegram_copy_format.py \
            scripts/generator.py \
            scripts/generator_managed.py \
            scripts/generate_online_subscription.py \
            scripts/deduplicator.py \
            scripts/validation_scheduler.py

      - name: Run regression tests
        if: github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          python -m unittest \
            tests.test_telegram_bot_control \
            tests.test_telegram_bot_control_verified \
            tests.test_telegram_bot_sources \
            tests.test_telegram_promo \
            tests.test_telegram_promo_text \
            tests.test_telegram_cycle_state \
            tests.test_telegram_publisher \
            tests.test_telegram_destinations \
            tests.test_telegram_multidestination \
            tests.test_online_subscription \
            tests.test_fair_validation -v

      - name: Verify Telegram bot connectivity
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          import telegram_bot_control as control
          me = control.telegram_api("getMe", {})
          if not isinstance(me, dict) or not me.get("id"):
              raise SystemExit("Telegram getMe returned invalid bot identity")
          print("Telegram bot connectivity preflight passed.")
          PY

      - name: Process Telegram publisher commands
        if: github.event_name != 'pull_request'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_SOURCE_ENCRYPTION_KEY: ${{ secrets.TELEGRAM_SOURCE_ENCRYPTION_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/telegram_bot_control_full.py
