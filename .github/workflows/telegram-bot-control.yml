name: Telegram Bot Control

on:
  schedule:
    - cron: "1,6,11,16,21,26,31,36,41,46,51,56 * * * *"
  workflow_run:
    workflows: ["Update Subscription"]
    types: [completed]
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - "scripts/telegram_bot_control.py"
      - "scripts/telegram_publisher_controlled.py"
      - ".github/workflows/telegram-bot-control.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: "telegram-bot-control"
  cancel-in-progress: false

jobs:
  poll:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check active publisher
        id: publisher_activity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/publish-telegram.yml/runs?per_page=30")

          active=$(printf '%s' "${response}" | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          active_statuses = {"queued", "in_progress", "pending", "requested", "waiting"}
          print(sum(1 for run in data.get("workflow_runs", []) if run.get("status") in active_statuses))
          ')

          echo "active=${active}" >> "$GITHUB_OUTPUT"
          echo "Active/waiting publisher runs: ${active}"

      - name: Process Telegram publisher commands
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || steps.publisher_activity.outputs.active == '0'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_CONTROL_CHAT_ID: "-1004469276021"
        run: python scripts/telegram_bot_control.py

      - name: Active publisher owns bot polling
        if: github.event_name != 'push' && github.event_name != 'workflow_dispatch' && steps.publisher_activity.outputs.active != '0'
        run: |
          echo "An active publisher is polling Telegram commands itself; standalone poll intentionally skipped to avoid concurrent getUpdates consumers."
