name: Telegram Bot Control

on:
  # GitHub cron is a backup only. workflow_run hooks below provide a second,
  # independently scheduled path so control commands are not stranded when
  # scheduled Actions are delayed.
  schedule:
    - cron: "1-56/5 * * * *"
  workflow_run:
    workflows:
      - "Update Subscription"
      - "Publish Telegram Configs"
    types: [completed]
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - "scripts/telegram_bot_control.py"
      - "scripts/telegram_publisher.py"
      - "scripts/telegram_publisher_control.py"
      - "scripts/telegram_publisher_controlled.py"
      - "tests/test_telegram_bot_control.py"
      - "tests/test_telegram_publisher.py"
      - ".github/workflows/telegram-bot-control.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: "telegram-bot-control"
  cancel-in-progress: false

jobs:
  poll:
    # workflow_run can theoretically be emitted for another branch. Never let
    # such a run consume the production bot's update queue.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Telegram scripts
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          python -m py_compile \
            scripts/telegram_bot_control.py \
            scripts/telegram_publisher.py \
            scripts/telegram_publisher_controlled.py \
            scripts/telegram_publisher_control.py

      - name: Run Telegram regression tests
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: python -m unittest tests.test_telegram_bot_control tests.test_telegram_publisher -v

      - name: Verify Telegram admin authorization path
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_CONTROL_CHAT_ID: "-1004469276021"
        run: |
          python - <<'PY'
          import sys
          sys.path.insert(0, "scripts")
          import telegram_bot_control as control

          admins = control.current_admin_ids()
          if not admins:
              raise SystemExit("Telegram returned no human administrators for the target group")
          print(f"Telegram admin authorization preflight passed: {len(admins)} human admin(s) visible")
          PY

      - name: Process Telegram publisher commands
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_CONTROL_CHAT_ID: "-1004469276021"
        run: python scripts/telegram_bot_control.py
