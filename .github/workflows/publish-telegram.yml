name: Publish Telegram Configs

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - "scripts/telegram_publisher.py"
      - "scripts/telegram_publisher_control.py"
      - "scripts/telegram_publisher_controlled.py"
      - "scripts/telegram_multidestination_publisher.py"
      - "scripts/telegram_destinations.py"
      - "scripts/telegram_copy_format.py"
      - "scripts/telegram_promo_config.py"
      - ".github/telegram-publisher-control.json"
      - ".github/workflows/publish-telegram.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: "telegram-publisher"
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout collector snapshot
        uses: actions/checkout@v4
        with:
          ref: main
          path: app

      - name: Check publisher control
        id: publisher_control
        working-directory: app
        run: python3 scripts/telegram_publisher_control.py --source local

      - name: Publisher is OFF
        if: steps.publisher_control.outputs.enabled != 'true'
        run: echo "Telegram publisher is OFF. No state is changed."

      - name: Checkout persistent Telegram state
        if: steps.publisher_control.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          ref: telegram-state
          path: state

      - name: Checkout encrypted Telegram destination state
        if: steps.publisher_control.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          ref: telegram-bot-state
          path: botstate

      - name: Set up Python
        if: steps.publisher_control.outputs.enabled == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.publisher_control.outputs.enabled == 'true'
        working-directory: app
        run: pip install -r requirements.txt

      - name: Check collector freshness
        id: collector_freshness
        if: steps.publisher_control.outputs.enabled == 'true'
        working-directory: app
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          stale, age = True, -1
          try:
              with open("data/status.json", "r", encoding="utf-8") as f:
                  status = json.load(f)
              stamp = datetime.fromisoformat(str(status.get("last_update") or "").replace("Z", "+00:00"))
              age = max(0, int((datetime.now(timezone.utc) - stamp).total_seconds()))
              stale = age > 20 * 60
          except Exception as exc:
              print(f"Collector freshness check failed: {exc}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"stale={'true' if stale else 'false'}\n")
              f.write(f"age_seconds={age}\n")
          print(f"Collector age: {age}s; stale={stale}")
          PY

      - name: Refresh stale collector in background
        if: steps.publisher_control.outputs.enabled == 'true' && steps.collector_freshness.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3; do
            if curl --fail-with-body --silent --show-error               --request POST               --header "Accept: application/vnd.github+json"               --header "Authorization: Bearer ${GH_TOKEN}"               --header "X-GitHub-Api-Version: 2022-11-28"               --header "Content-Type: application/json"               "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/update-subscription.yml/dispatches"               --data '{"ref":"main"}'; then
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "::warning::Collector refresh dispatch failed; live validation remains active."
          exit 0

      - name: Publish queued live configs
        id: telegram_publish
        if: steps.publisher_control.outputs.enabled == 'true'
        continue-on-error: true
        working-directory: app
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_SOURCE_ENCRYPTION_KEY: ${{ secrets.TELEGRAM_SOURCE_ENCRYPTION_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_DESTINATION_STATE_PATH: "../botstate/telegram_destinations.json"
          TELEGRAM_STATE_PATH: "../state/telegram_state.json"
          TELEGRAM_RUN_BUDGET_SECONDS: ${{ github.event_name == 'push' && '150' || '540' }}
          TELEGRAM_LIVE_CHECK_RETRIES: "2"
          TELEGRAM_STATE_PUSH_RETRIES: "5"
          TELEGRAM_REQUEST_RETRIES: "4"
          TELEGRAM_CONTROL_CHECK_INTERVAL_SECONDS: "5"
          TELEGRAM_DESTINATION_REFRESH_SECONDS: "10"
        run: python scripts/telegram_publisher_controlled.py

      - name: Final Telegram state safety push
        if: steps.publisher_control.outputs.enabled == 'true' && steps.telegram_publish.outcome != 'skipped'
        working-directory: state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add telegram_state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: final Telegram state checkpoint [automated]"
          fi
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:telegram-state; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1

      - name: Re-check publisher control after run
        id: publisher_control_after
        if: steps.publisher_control.outputs.enabled == 'true' && steps.telegram_publish.outcome == 'success'
        working-directory: app
        run: python scripts/telegram_publisher_control.py --source remote

      - name: Check Telegram backlog
        id: telegram_backlog
        if: steps.publisher_control.outputs.enabled == 'true' && steps.telegram_publish.outcome == 'success'
        working-directory: state
        run: |
          python - <<'PY'
          import json, os, time
          with open("telegram_state.json", encoding="utf-8") as f:
              data = json.load(f)
          pending = int(data.get("pending_total", 0) or 0)
          due = int(data.get("next_due_after", 0) or 0)
          due_in = max(0, due - int(time.time())) if due else 0
          dispatch_now = pending > 0 and due_in <= 600
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"pending={pending}\n")
              out.write(f"due_in={due_in}\n")
              out.write(f"dispatch_now={'true' if dispatch_now else 'false'}\n")
          print(f"Pending={pending}; due_in={due_in}s; dispatch_now={dispatch_now}")
          PY

      - name: Continue Telegram backlog
        if: steps.publisher_control.outputs.enabled == 'true' && steps.telegram_publish.outcome == 'success' && steps.publisher_control_after.outputs.enabled == 'true' && steps.telegram_backlog.outputs.dispatch_now == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3 4 5; do
            if curl --fail-with-body --silent --show-error               --request POST               --header "Accept: application/vnd.github+json"               --header "Authorization: Bearer ${GH_TOKEN}"               --header "X-GitHub-Api-Version: 2022-11-28"               --header "Content-Type: application/json"               "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/publish-telegram.yml/dispatches"               --data '{"ref":"main"}'; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "::warning::Self-dispatch failed; watchdog will recover due backlog."
          exit 0

      - name: Confirm graceful OFF during run
        if: steps.publisher_control.outputs.enabled == 'true' && steps.telegram_publish.outcome == 'success' && steps.publisher_control_after.outputs.enabled == 'false'
        run: echo "Publisher was switched OFF; destination queues are preserved."

      - name: Warn if Telegram publishing failed
        if: steps.publisher_control.outputs.enabled == 'true' && steps.telegram_publish.outcome == 'failure'
        run: echo "::warning::Telegram publisher failed; durable destination state is preserved."
