name: Publish Telegram Configs

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - "scripts/telegram_publisher.py"
      - ".github/workflows/publish-telegram.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: "telegram-publisher"
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout collector snapshot
        uses: actions/checkout@v4
        with:
          ref: main
          path: app

      - name: Checkout persistent Telegram state
        uses: actions/checkout@v4
        with:
          ref: telegram-state
          path: state

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check collector freshness
        id: collector_freshness
        working-directory: app
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          stale = True
          age = -1
          try:
              with open("data/status.json", "r", encoding="utf-8") as f:
                  status = json.load(f)
              value = str(status.get("last_update") or "").strip()
              stamp = datetime.fromisoformat(value.replace("Z", "+00:00"))
              age = max(0, int((datetime.now(timezone.utc) - stamp).total_seconds()))
              stale = age > 20 * 60
          except Exception as exc:
              print(f"Collector freshness check failed: {exc}")
              stale = True

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"stale={'true' if stale else 'false'}\n")
              f.write(f"age_seconds={age}\n")

          print(f"Collector age: {age}s; stale={stale}")
          PY

      - name: Refresh stale collector in background
        if: steps.collector_freshness.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::warning::Collector snapshot is stale. A refresh is being requested, but Telegram publishing will continue with per-config live validation."
          for attempt in 1 2 3; do
            if curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "Content-Type: application/json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/update-subscription.yml/dispatches" \
              --data '{"ref":"main"}'; then
              echo "Fresh collector run dispatched; publisher continues independently."
              exit 0
            fi
            echo "Collector dispatch attempt ${attempt} failed; retrying..."
            sleep $((attempt * 5))
          done
          echo "::warning::Collector refresh dispatch failed after 3 attempts. Live validation still protects Telegram sends."
          exit 0

      - name: Publish queued live configs
        id: telegram_publish
        continue-on-error: true
        working-directory: app
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "-1004469276021"
          TELEGRAM_TOPIC_ID: "1944"
          TELEGRAM_STATE_PATH: "../state/telegram_state.json"
          TELEGRAM_RUN_BUDGET_SECONDS: ${{ github.event_name == 'push' && '150' || '540' }}
          TELEGRAM_LIVE_CHECK_RETRIES: "2"
          TELEGRAM_STATE_PUSH_RETRIES: "5"
          TELEGRAM_REQUEST_RETRIES: "4"
        run: python scripts/telegram_publisher.py

      - name: Final Telegram state safety push
        if: steps.telegram_publish.outcome != 'skipped'
        working-directory: state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add telegram_state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: final Telegram state checkpoint [automated]"
          fi

          # The publisher already checkpoints after every send. This final push
          # is a second safety net in case the last network push was transient.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:telegram-state; then
              exit 0
            fi
            echo "Final state push attempt ${attempt} failed; retrying..."
            sleep $((attempt * 3))
          done

          echo "Failed to persist final Telegram state after 5 attempts." >&2
          exit 1

      - name: Check Telegram backlog
        id: telegram_backlog
        if: steps.telegram_publish.outcome == 'success'
        working-directory: state
        run: |
          pending=$(python -c 'import json; data=json.load(open("telegram_state.json", encoding="utf-8")); print(len(data.get("queue", [])))')
          echo "pending=${pending}" >> "$GITHUB_OUTPUT"
          echo "Pending Telegram configs: ${pending}"

      - name: Continue Telegram backlog
        if: steps.telegram_publish.outcome == 'success' && steps.telegram_backlog.outputs.pending != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Backlog remains; dispatching exactly one successor publisher run."
          for attempt in 1 2 3 4 5; do
            if curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "Content-Type: application/json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/publish-telegram.yml/dispatches" \
              --data '{"ref":"main"}'; then
              echo "Next publisher run dispatched successfully."
              exit 0
            fi
            echo "Publisher dispatch attempt ${attempt} failed; retrying..."
            sleep $((attempt * 3))
          done
          echo "::warning::Could not self-dispatch after 5 attempts. The external watchdog will recover the backlog."
          exit 0

      - name: Warn if Telegram publishing failed
        if: steps.telegram_publish.outcome == 'failure'
        run: |
          echo "::warning::Telegram publisher failed. Durable checkpoints limit duplicate risk; the external watchdog will retry later."
