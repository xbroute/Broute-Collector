name: Publish Telegram Configs

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - "scripts/telegram_publisher.py"
      - "scripts/telegram_multi_publisher.py"
      - "scripts/telegram_destinations.py"
      - "scripts/telegram_publisher_control.py"
      - "scripts/telegram_copy_format.py"
      - "scripts/telegram_promo_config.py"
      - ".github/telegram-publisher-control.json"
      - ".github/workflows/publish-telegram.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: "telegram-publisher"
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout collector snapshot
        uses: actions/checkout@v4
        with:
          ref: main
          path: app
          fetch-depth: 0

      - name: Check publisher control
        id: publisher_control
        working-directory: app
        run: python3 scripts/telegram_publisher_control.py --source local

      - name: Publisher is OFF
        if: steps.publisher_control.outputs.enabled != 'true'
        run: |
          echo "Telegram publisher is OFF. No Telegram state is changed and no successor run will be created."

      - name: Checkout persistent Telegram state
        if: steps.publisher_control.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          ref: telegram-state
          path: state
          fetch-depth: 0

      - name: Checkout encrypted Telegram destination state
        if: steps.publisher_control.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          ref: telegram-bot-state
          path: botstate
          fetch-depth: 0

      - name: Set up Python
        if: steps.publisher_control.outputs.enabled == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.publisher_control.outputs.enabled == 'true'
        working-directory: app
        run: pip install -r requirements.txt

      - name: Check collector freshness
        id: collector_freshness
        if: steps.publisher_control.outputs.enabled == 'true'
        working-directory: app
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone

          stale = True
          age = -1
          try:
              with open("data/status.json", "r", encoding="utf-8") as f:
                  status = json.load(f)
              value = str(status.get("last_update") or "").strip()
              stamp = datetime.fromisoformat(value.replace("Z", "+00:00"))
              age = max(0, int((datetime.now(timezone.utc) - stamp).total_seconds()))
              stale = age > 20 * 60
          except Exception as exc:
              print(f"Collector freshness check failed: {exc}")
              stale = True

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"stale={'true' if stale else 'false'}\n")
              f.write(f"age_seconds={age}\n")

          print(f"Collector age: {age}s; stale={stale}")
          PY

      - name: Refresh stale collector in background
        if: steps.publisher_control.outputs.enabled == 'true' && steps.collector_freshness.outputs.stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "::warning::Collector snapshot is stale. A refresh is being requested; live validation still protects every Telegram send."
          for attempt in 1 2 3; do
            if curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "Content-Type: application/json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/update-subscription.yml/dispatches" \
              --data '{"ref":"main"}'; then
              echo "Fresh collector run dispatched."
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "::warning::Collector refresh dispatch failed after 3 attempts."
          exit 0

      - name: Publish to enabled Telegram destinations
        id: telegram_publish
        if: steps.publisher_control.outputs.enabled == 'true'
        continue-on-error: true
        working-directory: app
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_SOURCE_ENCRYPTION_KEY: ${{ secrets.TELEGRAM_SOURCE_ENCRYPTION_KEY }}
          TELEGRAM_DESTINATION_ENCRYPTION_KEY: ${{ secrets.TELEGRAM_DESTINATION_ENCRYPTION_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_DESTINATION_STATE_PATH: "../botstate/telegram_destinations.json"
          TELEGRAM_STATE_PATH: "../state/telegram_multi_state.json"
          TELEGRAM_RUN_BUDGET_SECONDS: ${{ github.event_name == 'push' && '150' || '540' }}
          TELEGRAM_LIVE_CHECK_RETRIES: "2"
          TELEGRAM_STATE_PUSH_RETRIES: "5"
          TELEGRAM_REQUEST_RETRIES: "4"
          TELEGRAM_CONTROL_CHECK_INTERVAL_SECONDS: "5"
          TELEGRAM_SERVERS_REFRESH_SECONDS: "60"
        run: python scripts/telegram_multi_publisher.py

      - name: Final Telegram state safety push
        if: steps.publisher_control.outputs.enabled == 'true' && steps.telegram_publish.outcome != 'skipped'
        working-directory: state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add telegram_multi_state.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "chore: final multi-destination Telegram state checkpoint [automated]"
          fi

          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:telegram-state; then
              exit 0
            fi
            echo "Final state push attempt ${attempt} failed; retrying..."
            sleep $((attempt * 3))
          done

          echo "Failed to persist final Telegram state after 5 attempts." >&2
          exit 1

      - name: Re-check publisher control after run
        id: publisher_control_after
        if: steps.publisher_control.outputs.enabled == 'true' && steps.telegram_publish.outcome == 'success'
        working-directory: app
        run: python scripts/telegram_publisher_control.py --source remote

      - name: Continue multi-destination publishing
        if: steps.publisher_control.outputs.enabled == 'true' && steps.telegram_publish.outcome == 'success' && steps.publisher_control_after.outputs.enabled == 'true' && steps.telegram_publish.outputs.should_continue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "At least one enabled destination still has work; dispatching exactly one successor run."
          for attempt in 1 2 3 4 5; do
            if curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "Content-Type: application/json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/publish-telegram.yml/dispatches" \
              --data '{"ref":"main"}'; then
              echo "Next publisher run dispatched successfully."
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo "::warning::Could not self-dispatch; watchdog will recover while master publishing remains ON."
          exit 0

      - name: Confirm graceful stop
        if: steps.publisher_control.outputs.enabled == 'true' && steps.telegram_publish.outcome == 'success' && (steps.publisher_control_after.outputs.enabled == 'false' || steps.telegram_publish.outputs.should_continue != 'true')
        run: |
          echo "No successor run is required. Destination/global state is durable."

      - name: Warn if Telegram publishing failed
        if: steps.publisher_control.outputs.enabled == 'true' && steps.telegram_publish.outcome == 'failure'
        run: |
          echo "::warning::Telegram multi-destination publisher failed. Durable checkpoints limit duplicate risk; watchdog will retry while master publishing remains ON."
