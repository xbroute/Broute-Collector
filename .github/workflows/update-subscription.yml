name: Update Subscription

on:
  schedule:
    - cron: "3-58/5 * * * *"
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-subscription.yml"
      - "scripts/**"
      - "requirements.txt"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "update-subscription"
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout encrypted Telegram source state
        uses: actions/checkout@v4
        with:
          ref: telegram-bot-state
          path: botstate
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate and persist latest subscription snapshot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_SOURCE_ENCRYPTION_KEY: ${{ secrets.TELEGRAM_SOURCE_ENCRYPTION_KEY }}
          TELEGRAM_SOURCE_STATE_PATH: "botstate/telegram_subscription_sources.json"
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Generated data files are snapshots, not hand-edited source code. If
          # main advances while validation is running, rebasing two independently
          # generated snapshots creates meaningless conflicts. Instead, always
          # regenerate from the newest main and retry the whole snapshot commit.
          for attempt in 1 2 3; do
            echo "Collector snapshot attempt ${attempt}/3"

            git fetch origin main
            git reset --hard origin/main

            python scripts/generator_managed.py
            git add data/

            if git diff --cached --quiet; then
              echo "Collector produced no data changes."
              exit 0
            fi

            git commit -m "chore: update subscription data [automated]"

            if git push origin HEAD:main; then
              echo "Fresh collector snapshot persisted successfully."
              exit 0
            fi

            echo "Main advanced during snapshot attempt ${attempt}; regenerating from the new main..."
            sleep $((attempt * 5))
          done

          echo "Failed to persist a fresh collector snapshot after 3 full regeneration attempts." >&2
          exit 1

  deploy-pages:
    needs: update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: "github-pages-${{ github.run_attempt }}"
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: "github-pages-${{ github.run_attempt }}"
