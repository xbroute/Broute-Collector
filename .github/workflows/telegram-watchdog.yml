name: Telegram Publisher Watchdog

on:
  workflow_run:
    workflows: ["Update Subscription"]
    types: [completed]
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read

concurrency:
  group: "telegram-publisher-watchdog"
  cancel-in-progress: true

jobs:
  ensure-publisher:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check publisher control
        id: publisher_control
        run: python3 scripts/telegram_publisher_control.py --source local

      - name: Publisher intentionally OFF
        if: steps.publisher_control.outputs.enabled != 'true'
        run: |
          echo "Telegram publisher is OFF. Watchdog intentionally does not dispatch anything."

      - name: Checkout encrypted Telegram destination state
        if: steps.publisher_control.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          ref: telegram-bot-state
          path: botstate
          fetch-depth: 1

      - name: Check for enabled Telegram destinations
        id: destination_activity
        if: steps.publisher_control.outputs.enabled == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_SOURCE_ENCRYPTION_KEY: ${{ secrets.TELEGRAM_SOURCE_ENCRYPTION_KEY }}
          TELEGRAM_DESTINATION_ENCRYPTION_KEY: ${{ secrets.TELEGRAM_DESTINATION_ENCRYPTION_KEY }}
        run: |
          python3 -m pip install --quiet cryptography
          python3 - <<'PY'
          import json
          import os
          import sys

          sys.path.insert(0, "scripts")
          from telegram_destinations import decrypt_store

          path = "botstate/telegram_destinations.json"
          enabled = False
          if os.path.exists(path):
              with open(path, "r", encoding="utf-8") as f:
                  store = decrypt_store(json.load(f))
              enabled = any(
                  isinstance(item, dict)
                  and item.get("enabled") is True
                  and item.get("bot_status") == "administrator"
                  for item in store.get("destinations", [])
              )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"enabled={'true' if enabled else 'false'}\n")
          print(f"Enabled Telegram destination exists: {enabled}")
          PY

      - name: No enabled Telegram destinations
        if: steps.publisher_control.outputs.enabled == 'true' && steps.destination_activity.outputs.enabled != 'true'
        run: |
          echo "Global publisher is ON but no destination is enabled. Watchdog intentionally does nothing."

      - name: Check for active or waiting publisher runs
        id: publisher_activity
        if: steps.publisher_control.outputs.enabled == 'true' && steps.destination_activity.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          response=""
          for attempt in 1 2 3; do
            if response=$(curl --fail-with-body --silent --show-error \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/publish-telegram.yml/runs?per_page=30"); then
              break
            fi
            echo "Publisher status query attempt ${attempt} failed; retrying..."
            sleep $((attempt * 3))
          done

          if [ -z "${response}" ]; then
            echo "Could not query publisher workflow status." >&2
            exit 1
          fi

          active=$(printf '%s' "${response}" | python3 -c '
          import json, sys
          data = json.load(sys.stdin)
          active_statuses = {"queued", "in_progress", "pending", "requested", "waiting"}
          print(sum(1 for run in data.get("workflow_runs", []) if run.get("status") in active_statuses))
          ')

          echo "active=${active}" >> "$GITHUB_OUTPUT"
          echo "Active/waiting publisher runs: ${active}"

      - name: Dispatch publisher only when none is active
        if: steps.publisher_control.outputs.enabled == 'true' && steps.destination_activity.outputs.enabled == 'true' && steps.publisher_activity.outputs.active == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "Publisher is ON and no run is active or waiting; dispatching one recovery run."

          for attempt in 1 2 3 4 5; do
            if curl --fail-with-body --silent --show-error \
              --request POST \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              --header "Content-Type: application/json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/publish-telegram.yml/dispatches" \
              --data '{"ref":"main"}'; then
              echo "Publisher recovery run dispatched successfully."
              exit 0
            fi
            echo "Publisher recovery dispatch attempt ${attempt} failed; retrying..."
            sleep $((attempt * 3))
          done

          echo "Failed to dispatch publisher after 5 attempts." >&2
          exit 1

      - name: Publisher already covered
        if: steps.publisher_control.outputs.enabled == 'true' && steps.destination_activity.outputs.enabled == 'true' && steps.publisher_activity.outputs.active != '0'
        run: |
          echo "Publisher is ON and already has an active/waiting run; watchdog intentionally does nothing."
